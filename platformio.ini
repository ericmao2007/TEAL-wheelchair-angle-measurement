[env:xiao_esp32s3]
platform = espressif32@6.9.0
; Seeed Studio XIAO ESP32S3, native USB CDC serial.
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D BNO_CS=D0
    -D BNO_INT=D1
    -D BNO_RESET=D3
    -D BNO_MOSI=D10
    -D BNO_MISO=D9
    -D BNO_SCK=D8
